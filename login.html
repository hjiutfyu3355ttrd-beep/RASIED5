<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="theme-color" content="#063e39" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="المشاريع" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>تسجيل الدخول — نظام المشاريع</title>
  <link rel="icon" href="assets/img/icon-192.png" type="image/png" />
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body class="auth-body" data-page="login">
  <div class="auth-shell">
    <aside class="auth-hero">
      <div class="auth-brand"><img class="brand-logo" src="assets/img/logo-128.png" width="52" height="52" alt="" /><b>نظام إدارة المشاريع والتشطيبات</b></div>
    </aside>

    <main class="auth-main">
      <div class="auth-card card">
        <div class="seg auth-tabs" role="tablist" id="tabs">
          <button type="button" role="tab" id="tab-login" class="on">تسجيل الدخول</button>
          <button type="button" role="tab" id="tab-reg">حساب جديد</button>
        </div>

        <form id="form-login" class="stack" novalidate>
          <h2 class="auth-h">تسجيل الدخول</h2>
          <div class="field"><label for="l-id">رقم الهاتف أو البريد الإلكتروني</label><input id="l-id" type="text" inputmode="tel" dir="ltr" autocomplete="username" required /></div>
          <div class="field"><label for="l-pass">كلمة المرور</label><div class="pw"><input id="l-pass" type="password" dir="ltr" autocomplete="current-password" required /><button type="button" class="ghost pw-eye" data-eye="l-pass" aria-label="إظهار">👁</button></div></div>
          <div style="text-align:end;margin-top:-6px"><button type="button" class="ghost small" id="forgot">نسيت كلمة المرور؟</button></div>
          <div class="auth-err" id="err-login" role="alert" hidden></div>
          <button class="primary auth-submit" type="submit" id="btn-login">دخول</button>
        </form>

        <form id="form-reg" class="stack" novalidate hidden>
          <h2 class="auth-h">إنشاء حساب</h2>
          <div class="field"><label for="r-name">اسمك</label><input id="r-name" autocomplete="name" required /></div>
          <div class="field"><label for="r-co">اسم الشركة</label><input id="r-co" autocomplete="organization" required /></div>
          <div class="field"><label for="r-phone">رقم الهاتف</label><input id="r-phone" type="tel" inputmode="tel" dir="ltr" autocomplete="username" required /></div>
          <div class="field"><label for="r-pass">كلمة المرور</label><div class="pw"><input id="r-pass" type="password" dir="ltr" autocomplete="new-password" minlength="6" required /><button type="button" class="ghost pw-eye" data-eye="r-pass" aria-label="إظهار">👁</button></div></div>
          <div class="auth-err" id="err-reg" role="alert" hidden></div>
          <button class="primary auth-submit" type="submit" id="btn-reg">إنشاء الحساب</button>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js?v=3"></script>
  <script src="js/db.js?v=3"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/login.js?v=3"></script>
  <script defer src="js/pwa.js?v=3"></script>
</body>
</html>
